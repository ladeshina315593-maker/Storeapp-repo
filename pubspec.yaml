name: flutter_ecommerce_app
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^4.12.0
  firebase_auth: ^6.5.5
  cloud_firestore: ^6.7.0

  # Authentication providers
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.2
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

What this gives Grape Go

Your backend structure will be:

Firebase
│
├── Firebase Authentication
│   ├── Email / Password
│   ├── Phone + OTP
│   ├── Google
│   ├── Facebook
│   └── Apple
│
└── Cloud Firestore
    │
    ├── users
    │   └── {uid}
    │       ├── name
    │       ├── email
    │       ├── phone
    │       ├── photoUrl
    │       ├── createdAt
    │       └── updatedAt
    │
    ├── products
    │
    ├── carts
    │
    ├── favorites
    │
    ├── orders
    │
    └── notifications

Firebase Authentication supports email/password, phone authentication, Google, Facebook and Apple providers, provided you enable the providers in the Firebase console.

Important: adding these packages does not by itself connect the app to your Firebase project. After "pubspec.yaml", you need to configure Firebase and generate "firebase_options.dart". Firebase's current setup specifically uses "flutterfire configure" for that.

So our next order should be:

1. "pubspec.yaml" ← this one
2. Firebase configuration ("firebase_options.dart")
3. "auth_repository.dart"
4. "user_repository.dart"
5. Connect Login
6. Connect Sign Up
7. Connect Phone + OTP
8. Connect Google / Facebook / Apple
9. Profile Setup → Firestore
10. Auth state → Home

That way we're building a real Firebase backend, not fake buttons or fake authentication.
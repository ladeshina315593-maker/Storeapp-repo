name: flutter_ecommerce_app
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # iOS icons
  cupertino_icons: ^1.0.8

  # UI / Fonts
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^4.12.0
  firebase_auth: ^6.5.5
  cloud_firestore: ^6.7.0

  # Social Authentication
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.2
  sign_in_with_apple: ^7.0.1

  # Phone Country Picker
  country_picker: ^2.0.27

  # Camera / Image Search
  image_picker: ^1.1.2

  # File / System
  path_provider: ^2.1.6
  process: ^5.0.6
  file: ^7.0.1

  # Google Maps / Dispatch Tracking
  google_maps_flutter: ^2.13.1
  firebase_storage: ^13.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
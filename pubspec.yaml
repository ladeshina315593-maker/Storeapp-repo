name: pikkx
description: PikkX - Your global marketplace.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # iOS icons
  cupertino_icons: ^1.0.8

  # UI / Fonts
  google_fonts: ^6.2.1

  # Firebase
  firebase_core: ^4.12.0
  firebase_auth: ^6.5.5
  cloud_firestore: ^6.7.0
  firebase_storage: ^13.5.0

  # Social Authentication
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.2
  sign_in_with_apple: ^7.0.1

  # Country / Phone
  country_picker: ^2.0.27

  # Images
  image_picker: ^1.1.2

  # File / System
  path_provider: ^2.1.6
  process: ^5.0.6
  file: ^7.0.1

  # Google Maps / Dispatch Tracking
  google_maps_flutter: ^2.13.1

  # Currency / User Preferences
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/pikkx_icon.jpg
  min_sdk_android: 21

flutter_native_splash:
  color: "#050505"
  image: assets/images/pikkx_icon.jpg
  android: true
  ios: false
  fullscreen: true
